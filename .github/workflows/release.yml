name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zapreq-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/zapreq
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zapreq-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/zapreq
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zapreq-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/zapreq
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zapreq-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/zapreq.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-files
          cp release-artifacts/zapreq-linux-x86_64/zapreq \
            release-files/zapreq-linux-x86_64
          cp release-artifacts/zapreq-macos-x86_64/zapreq \
            release-files/zapreq-macos-x86_64
          cp release-artifacts/zapreq-macos-arm64/zapreq \
            release-files/zapreq-macos-arm64
          cp release-artifacts/zapreq-windows-x86_64.exe/zapreq.exe \
            release-files/zapreq-windows-x86_64.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-files/zapreq-linux-x86_64
            release-files/zapreq-macos-x86_64
            release-files/zapreq-macos-arm64
            release-files/zapreq-windows-x86_64.exe

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
